<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>

  <!-- Trophy -->
  <g transform="translate(200, 70)">
    <!-- Cup -->
    <path d="M -40 0 L -30 80 L 30 80 L 40 0 Z" fill="#ffd700"/>
    <!-- Handles -->
    <ellipse cx="-50" cy="30" rx="15" ry="25" fill="none" stroke="#ffd700" stroke-width="8"/>
    <ellipse cx="50" cy="30" rx="15" ry="25" fill="none" stroke="#ffd700" stroke-width="8"/>
    <!-- Base -->
    <rect x="-25" y="80" width="50" height="15" fill="#ffd700"/>
    <rect x="-35" y="95" width="70" height="10" rx="3" fill="#daa520"/>
    <!-- Star -->
    <polygon points="0,20 5,35 20,35 8,45 13,60 0,50 -13,60 -8,45 -20,35 -5,35" fill="white"/>
  </g>

  <!-- Confetti -->
  <rect x="50" y="30" width="10" height="10" fill="#22c55e" transform="rotate(30 55 35)"/>
  <rect x="330" y="50" width="12" height="12" fill="#ef4444" transform="rotate(-20 336 56)"/>
  <rect x="80" y="180" width="8" height="8" fill="#ffd700" transform="rotate(45 84 184)"/>
  <rect x="310" y="160" width="10" height="10" fill="#2563eb" transform="rotate(15 315 165)"/>
  <circle cx="120" cy="60" r="6" fill="#22c55e"/>
  <circle cx="280" cy="90" r="5" fill="#ef4444"/>
  <circle cx="70" cy="120" r="4" fill="#ffd700"/>

  <!-- Coming Soon text -->
  <rect x="100" y="220" width="200" height="50" rx="10" fill="rgba(34,197,94,0.9)"/>
  <text x="200" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">COMING SOON</text>
</svg>
