<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="50%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg4)"/>

  <!-- Camera icon -->
  <g transform="translate(200, 100)">
    <rect x="-60" y="-20" width="120" height="80" rx="10" fill="rgba(255,255,255,0.9)"/>
    <rect x="-20" y="-35" width="40" height="20" rx="5" fill="rgba(255,255,255,0.9)"/>
    <circle cx="0" cy="20" r="30" fill="none" stroke="#1e3a5f" stroke-width="5"/>
    <circle cx="0" cy="20" r="18" fill="#1e3a5f"/>
    <circle cx="40" cy="-5" r="8" fill="#22c55e"/>
  </g>

  <!-- Flash lines -->
  <g stroke="rgba(255,255,255,0.5)" stroke-width="3">
    <line x1="100" y1="50" x2="130" y2="70"/>
    <line x1="80" y1="80" x2="110" y2="90"/>
    <line x1="300" y1="50" x2="270" y2="70"/>
    <line x1="320" y1="80" x2="290" y2="90"/>
  </g>

  <!-- Coming Soon text -->
  <rect x="100" y="220" width="200" height="50" rx="10" fill="rgba(255,255,255,0.9)"/>
  <text x="200" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e3a5f">PHOTOS COMING</text>
</svg>
