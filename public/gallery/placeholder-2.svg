<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)"/>

  <!-- Stumps -->
  <g transform="translate(280, 80)">
    <rect x="0" y="0" width="8" height="80" fill="white"/>
    <rect x="20" y="0" width="8" height="80" fill="white"/>
    <rect x="40" y="0" width="8" height="80" fill="white"/>
    <rect x="-2" y="-8" width="16" height="6" rx="2" fill="white"/>
    <rect x="30" y="-8" width="20" height="6" rx="2" fill="white"/>
  </g>

  <!-- Cartoon kids silhouettes -->
  <circle cx="100" cy="150" r="20" fill="rgba(255,255,255,0.3)"/>
  <ellipse cx="100" cy="200" rx="15" ry="30" fill="rgba(255,255,255,0.3)"/>

  <circle cx="150" cy="140" r="22" fill="rgba(255,255,255,0.4)"/>
  <ellipse cx="150" cy="195" rx="16" ry="35" fill="rgba(255,255,255,0.4)"/>

  <circle cx="200" cy="155" r="18" fill="rgba(255,255,255,0.35)"/>
  <ellipse cx="200" cy="205" rx="14" ry="28" fill="rgba(255,255,255,0.35)"/>

  <!-- Fun rays -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="3">
    <line x1="50" y1="30" x2="70" y2="50"/>
    <line x1="80" y1="20" x2="90" y2="45"/>
    <line x1="350" y1="250" x2="370" y2="270"/>
    <line x1="320" y1="260" x2="330" y2="280"/>
  </g>

  <!-- Coming Soon text -->
  <rect x="100" y="220" width="200" height="50" rx="10" fill="rgba(30,58,95,0.9)"/>
  <text x="200" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">COMING SOON</text>
</svg>
