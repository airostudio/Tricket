<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="#fff" stroke-width="4"/>
  <!-- Cricket Bat Shape -->
  <rect x="85" y="40" width="30" height="100" rx="5" fill="#d4a574"/>
  <rect x="85" y="40" width="30" height="20" rx="5" fill="#8b6f4e"/>
  <!-- Tennis Ball -->
  <circle cx="130" cy="130" r="25" fill="#c8e64a"/>
  <path d="M 110 145 Q 130 125 150 145" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M 115 115 Q 130 135 145 115" fill="none" stroke="#fff" stroke-width="3"/>
  <!-- Stumps -->
  <rect x="150" y="80" width="6" height="50" fill="#f5f5f5"/>
  <rect x="160" y="80" width="6" height="50" fill="#f5f5f5"/>
  <rect x="170" y="80" width="6" height="50" fill="#f5f5f5"/>
  <!-- Bails -->
  <rect x="148" y="76" width="12" height="4" rx="2" fill="#f5f5f5"/>
  <rect x="164" y="76" width="14" height="4" rx="2" fill="#f5f5f5"/>
  <!-- Text: TRICKET -->
  <text x="100" y="185" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" font-weight="bold">
    <tspan fill="#60a5fa">TRI</tspan><tspan fill="#22c55e">CKET</tspan>
  </text>
</svg>
